name: Add optional fourth hint

on:
  push:
    paths:
      - '.github/workflows/add-optional-fourth-hint.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add optional fourth hint UI
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          old_css='.hidden{display:none}@media(max-width:430px)'
          new_css='.hidden{display:none}.hint-more{width:100%;border:1px dashed #bfd5c9;background:#fbfcf9;color:#3d6b5d;border-radius:11px;padding:10px 12px;font-size:13px;font-weight:800}.hint-more:hover{background:#f1f7f3}.hint.extra{background:#f2f7f4;border:1px solid #d7e6de}@media(max-width:430px)'
          if old_css not in s: raise SystemExit('CSS target not found')
          s=s.replace(old_css,new_css,1)

          old_note='<div class="sub" style="text-align:center;font-size:12px">使える文字 ＝ 答えの文字 ＋ ダミー4文字<br>同じ文字は何度でも押せます。空白・ハイフンは自動です。</div>'
          new_note='<div class="sub" style="text-align:center;font-size:12px">同じ文字は何度でも押せます。空白・ハイフンは自動です。</div>'
          if old_note not in s: raise SystemExit('instruction target not found')
          s=s.replace(old_note,new_note,1)

          marker='let questions,index,entry,solved,allowed,history,correctAnswer,roundRecorded=false;'
          helper="""function extraHintFor(q){
            const h=q.hints.join(' ').toLowerCase();
            if(/this person|this man|this woman|person works|person teaches|person makes|person flies|person tells/.test(h))return 'Think of a job or role a person can have.';
            if(/you do this|people do this|students do this|you can hear .* this way|when someone is talking/.test(h))return 'The answer is often used as an action word.';
            if(/wear|clothes|shirt|jacket|shoe|hat|dress|pants|coat/.test(h))return 'You might think about this when getting dressed.';
            if(/eat|drink|meal|breakfast|lunch|dinner|sweet|fruit|vegetable|spoon|fork|hungry|thirsty/.test(h))return 'You may have this as part of a meal or snack.';
            if(/part of your|part of the body|on your hands|on your face|your leg|your arm|your head|your foot|your feet/.test(h))return 'It is connected with the human body.';
            if(/bird|animal|farm|forest|mountain|zoo/.test(h))return 'You may meet or see this in nature or around animals.';
            if(/train|bus|airport|airplane|road|car|bicycle|bike|travel|trip/.test(h))return 'You may hear or use this word when traveling.';
            if(/school|student|classroom|teacher|study/.test(h))return 'You may hear or use this word at school.';
            if(/room|house|home|door|wall|table|chair|bed|kitchen/.test(h))return 'You may see or use this around a home or building.';
            if(/color/.test(h))return 'This word can describe how something looks.';
            if(/feeling|feel good|feel bad|happy|sad|angry|afraid/.test(h))return 'This word can describe how someone feels.';
            if(/people wait here|people go here|people visit|near the sea|place/.test(h))return 'Think of a place people can go to.';
            if(/you use it|people use it|you use them|people use them/.test(h))return 'It is something people may use in everyday life.';
            if(/opposite of/.test(h))return 'Think about what kind of situation this word can describe.';
            return 'Think about a situation where you would hear or use this word.';
          }
          function addFourthHint(q){
            const d=document.createElement('div');d.className='hint extra';
            const n=document.createElement('span');n.className='num';n.textContent='4';
            const t=document.createElement('span');t.textContent=extraHintFor(q);
            d.append(n,t);$('hints').append(d);
          }
          """
          if marker not in s: raise SystemExit('JS marker not found')
          s=s.replace(marker,helper+marker,1)

          old_render="q.hints.forEach((h,i)=>{const d=document.createElement('div');d.className='hint';const n=document.createElement('span');n.className='num';n.textContent=i+1;const t=document.createElement('span');t.textContent=h;d.append(n,t);$('hints').append(d)});$('feedback').textContent='';"
          new_render="q.hints.forEach((h,i)=>{const d=document.createElement('div');d.className='hint';const n=document.createElement('span');n.className='num';n.textContent=i+1;const t=document.createElement('span');t.textContent=h;d.append(n,t);$('hints').append(d)});const more=document.createElement('button');more.type='button';more.className='hint-more';more.textContent='＋ もう1ヒント';more.onclick=()=>{more.remove();addFourthHint(q)};$('hints').append(more);$('feedback').textContent='';"
          if old_render not in s: raise SystemExit('hint render target not found')
          s=s.replace(old_render,new_render,1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Add optional fourth hint to Ateru"
          git push
