function load(){entry='';solved=false;correctAnswer='';const q=questions[index];allowed=new Set(q.answers.join('').replace(/[^a-z]/g,''));shuffle([...'abcdefghijklmnopqrstuvwxyz'].filter(x=>!allowed.has(x))).slice(0,4).forEach(x=>allowed.add(x));$('progress').textContent=`QUESTION ${index+1} / 5`;$('dots').replaceChildren();for(let i=0;i<5;i++){const d=document.createElement('span');d.className='dot'+(i<index?' done':i===index?' now':'');$('dots').append(d)}$('hints').replaceChildren();q.hints.forEach((h,i)=>{const d=document.createElement('div');d.className='hint';const n=document.createElement('span');n.className='num';n.textContent=i+1;const t=document.createElement('span');t.textContent=h;d.append(n,t);$('hints').append(d)});$('feedback').textContent='';$('feedback').className='feedback';$('next').classList.add('hidden');$('next').textContent=index===4?'クリア画面へ →':'次の問題へ →';$('keyboard').replaceChildren();['qwertyuiop','asdfghjkl','zxcvbnm'].forEach(chars=>{const row=document.createElement('div');row.className='row';for(const c of chars){const b=document.createElement('button');b.className='key';b.textContent=c.toUpperCase();b.dataset.letter=c;b.disabled=!allowed.has(c);b.setAttribute('aria-label',c.toUpperCase());b.onclick=()=>add(c);row.append(b)}$('keyboard').append(row)});render()}
function render(){const q=questions[index];let template=q.answers[0];if(solved)template=correctAnswer;else{const exact=q.answers.find(a=>letters(a)===entry);if(exact)template=exact;else if(entry.length>letters(template).length)template=q.answers.reduce((a,b)=>letters(a).length>letters(b).length?a:b)}$('answer').replaceChildren();let n=0;for(const c of template){const s=document.createElement('span');if(/[a-z]/.test(c)){s.className='slot'+(entry[n]?' filled':'');s.textContent=(entry[n++]||'').toUpperCase()}else{s.className='slot separator';s.textContent=c===' '?' ':c}$('answer').append(s)}const sizes=[...new Set(q.answers.map(a=>letters(a).length))];$('length').textContent=solved?'正解：'+correctAnswer:sizes.join(' または ')+'文字'+(template.includes(' ')?'（複数の単語）':'');$('check').disabled=solved||!entry;$('erase').disabled=solved||!entry;$('reset').disabled=solved||!entry}
function add(c){if(solved||!allowed.has(c))return;const max=Math.max(...questions[index].answers.map(a=>letters(a).length));if(entry.length>=max)return;entry+=c;$('feedback').textContent='';render()}
function erase(all=false){if(solved)return;entry=all?'':entry.slice(0,-1);$('feedback').textContent='';render()}
function check(){if(solved||!entry)return;const q=questions[index];correctAnswer=q.answers.find(a=>letters(a)===entry);if(correctAnswer){solved=true;history.push(correctAnswer);$('feedback').className='feedback success';$('feedback').textContent='✓ 正解！ よくできました！';document.querySelectorAll('.key').forEach(b=>b.disabled=true);$('next').classList.remove('hidden');render();$('next').focus()}else{$('feedback').className='feedback error';$('feedback').textContent='もう少し！ ヒントを読んで、もう一度考えよう。'}}
$('erase').onclick=()=>erase();$('reset').onclick=()=>erase(true);$('check').onclick=check;$('next').onclick=()=>{if(!solved)return;if(index<4){index++;load()}else{showResult()}};
function showResult(){$('game').classList.add('hidden');$('result').classList.remove('hidden');$('result').replaceChildren();const wrap=document.createElement('div');wrap.className='clear';wrap.innerHTML='<div class="medal">🏆</div><div class="tag">ALL FIVE COMPLETE!</div><h1>クリア！</h1><p class="sub">5問すべて正解。おめでとう！</p>';const ul=document.createElement('ul');ul.className='review';history.forEach((a,i)=>{const li=document.createElement('li');li.textContent=`${i+1}. ${a}`;const s=document.createElement('span');s.textContent='✓';li.append(s);ul.append(li)});const b=document.createElement('button');b.className='btn primary';b.style.width='100%';b.textContent='もう一度あそぶ →';b.onclick=start;wrap.append(ul,b);$('result').append(wrap);b.focus()}
document.addEventListener('keydown',e=>{if($('game').classList.contains('hidden')||e.ctrlKey||e.metaKey||e.altKey)return;if(e.key==='Enter'&&e.target.tagName==='BUTTON')return;if(/^[a-z]$/i.test(e.key)){e.preventDefault();add(e.key.toLowerCase())}else if(e.key==='Backspace'){e.preventDefault();erase()}else if(e.key==='Enter'){e.preventDefault();if(solved)$('next').click();else check()}});
start();
</script></html>
